name: ci

# Every PR and push to the main branch must satisfy the release gate defined
# in docs/ROADMAP.md. Release packaging itself lives in release.yml.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The operator ships Windows only; validate on the host platform we
        # actually distribute. Linux pty tests use ConPTY semantics and are
        # not a release gate for this personal build.
        os: [windows-latest]
    steps:
      # GitHub's Windows runners default to core.autocrlf=true; without this,
      # checkout rewrites .go files to CRLF and gofmt reports every file.
      - name: Normalize line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      # Windows amd64 is the only shipped target; build it with no cgo here
      # instead of producing binaries for platforms we do not distribute.
      - name: build (no cgo)
        env:
          CGO_ENABLED: '0'
        run: go build ./cmd/argent

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: install
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: ui
        run: bun run typecheck
      - name: test
        working-directory: ui
        run: bun run test
      - name: build
        working-directory: ui
        run: bun run build
