name: ci

# Every PR and push to the main branch must satisfy the release gate defined
# in docs/ROADMAP.md. Release packaging itself lives in release.yml.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The operator ships Windows only; validate on the host platform we
        # actually distribute. Linux pty tests use ConPTY semantics and are
        # not a release gate for this personal build.
        os: [windows-latest]
    steps:
      # GitHub's Windows runners default to core.autocrlf=true; without this,
      # checkout rewrites .go files to CRLF and gofmt reports every file.
      - name: Normalize line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      # Windows amd64 is the only shipped target; build it with no cgo here
      # instead of producing binaries for platforms we do not distribute.
      - name: build (no cgo)
        env:
          CGO_ENABLED: '0'
        run: go build ./cmd/argent
      # AGENTS.md promises this cross-compile property; verify it on every PR
      # instead of relying on a one-off local check.
      - name: cross-compile (linux/amd64, no cgo)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build ./...

  race:
    name: go test -race (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The race detector needs cgo; Linux runners ship gcc, so this is the
      # reliable place to enforce the concurrency release gate. (The Windows
      # job cannot run -race reliably with the bundled MinGW toolchain.)
      - name: go test -race
        env:
          CGO_ENABLED: '1'
        # internal/pty's tests require a real controlling terminal (ConPTY
        # semantics) and cannot run on a CI runner; the Windows job covers
        # them. Exclude only that package so the race gate still checks all
        # cross-platform packages.
        run: go test -race $(go list ./... | grep -v '/internal/pty$')
