name: ci

# 每个 PR 以及推送到主分支都必须满足发布门禁，该门禁定义在
# docs/STATUS.md（Roadmap 一节）中。发布打包流程在 release.yml 中。

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 运维者仅发布 Windows 版本；因此只在实际分发的宿主平台上验证。
        # Linux 的 pty 测试使用 ConPTY 语义，对于这个个人构建而言
        # 不属于发布门禁。
        os: [windows-latest]
    steps:
      # GitHub 的 Windows runner 默认 core.autocrlf=true；如果不设置该项，
      # checkout 会把 .go 文件改写为 CRLF，导致 gofmt 报出每一个文件。
      - name: Normalize line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      # 基准测试也是测试：即使 CI 不计时，其中的断言也必须在 go test 下通过。
      # -benchtime=1x 只跑一次迭代以触发断言，避免 CI 上的计时噪声；
      # -run '^$' 跳过普通测试，只执行 benchmark。
      - name: benchmark smoke
        run: go test -run '^$' -bench . -benchtime=1x ./internal/agent ./internal/session ./internal/tools ./internal/tui
      # Windows amd64 是唯一发布的目标；这里直接用无 cgo 方式构建它，
      # 而不是为不发布的平台生成二进制文件。
      - name: build (no cgo)
        env:
          CGO_ENABLED: '0'
        run: go build ./cmd/argent
      # AGENTS.md 承诺了这一交叉编译特性；应在每个 PR 上验证它，
      # 而不要依赖一次性的本地检查。
      - name: cross-compile (linux/amd64, no cgo)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build ./...

  race:
    name: go test -race (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # 竞态检测器需要 cgo；Linux runner 自带 gcc，因此这里是执行并发
      # 发布门禁的可靠位置。（Windows 作业使用附带的 MinGW 工具链无法
      # 可靠地运行 -race。）
      - name: go test -race
        env:
          CGO_ENABLED: '1'
        # internal/pty 的测试需要真正的控制终端（ConPTY 语义），
        # 无法在 CI runner 上运行；Windows 作业已经覆盖了它们。
        # 只排除该包，这样竞态门禁仍能检查所有
        # 跨平台包。设置宽松但有上限的超时，避免挂起的测试无限阻塞作业。
        run: go test -race -timeout 20m $(go list ./... | grep -v '/internal/pty$')
