name: ci

# Every PR and push to the main branch must satisfy the release gate defined
# in docs/ROADMAP.md. Release packaging itself lives in release.yml.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: cross-compile (no cgo)
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build -o /tmp/argent-linux-arm64 ./cmd/argent

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: install
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: ui
        run: bun run typecheck
      - name: test
        working-directory: ui
        run: bun run test
      - name: build
        working-directory: ui
        run: bun run build
