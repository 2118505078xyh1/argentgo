name: matrix

# 跨平台验证，作为对现有两个工作流的补充：
#
#   ci.yml      push / pull_request ：在发布的 Windows 目标上执行 gofmt、vet、
#                                     test、build 以及竞态门禁。
#   release.yml tag (v*)            ：强化的发布打包，由其自身的验证与竞态作业
#                                     把关。
#   matrix.yml  push main/master / PR / manual：客观验证 no-cgo 承诺、
#                                     无 cgo 的单元测试、Linux 上的竞态门禁，
#                                     以及架构守卫。
#
# 特意不按 tag 触发：tag 由 release.yml 负责，在 tag 上重跑这个矩阵只会消耗
# runner 分钟数，而不会增加任何新的门禁。
# 仅用于测试的工作流：不会发布任何内容，也不使用任何身份验证。
# 最小权限：每个作业只能读取仓库，没有其它权限。

# 加引号是为了防止 YAML 1.1 工具（如 PyYAML）将 `on` 强制转换为布尔值 true。
'on':
  # 与 ci.yml 对齐：推送到主分支也跑矩阵；仍特意不按 tag 触发（tag 由 release.yml 负责）。
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      flake_guard:
        description: '手动触发 flake-guard 重复稳定性检查（非 PR 阻塞）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # AGENTS.md 中规定“所有代码都必须能用 CGO_ENABLED=0 交叉编译”，
  # 这里针对每一个受支持的 OS/arch 都做了断言，而不只是抽查一个目标。
  # 构建 `./...` 会包含 native/，因此意外的 cgo 依赖或平台专属的导入
  # 都会让矩阵明显失败。不会产出任何制品：
  # 构建成功本身就是证明。
  crossbuild:
    name: crossbuild (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # 与 ci.yml / release.yml 使用相同的固定版本
          cache: true
      - name: build (CGO_ENABLED=0, ${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  # 单元测试不得依赖 C 工具链。在标准的 Linux runner 上禁用 cgo 运行
  # 即可证明这一点，并给出一个独立于 ci.yml 中 Windows 作业的
  # 可移植信号。
  unit:
    name: unit (ubuntu-latest, no cgo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test (CGO_ENABLED=0)
        env:
          CGO_ENABLED: '0'
        run: go test ./...

  # 竞态门禁与 ci.yml 的 race 作业一致：检测器需要 cgo + gcc，
  # Linux runner 提供了这些。internal/pty 的测试需要真正的控制终端
  # （ConPTY 语义），无法在 runner 上运行，因此只排除该包；
  # Windows 上的 ci.yml 作业仍会覆盖它。
  race:
    name: race (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        env:
          CGO_ENABLED: '1'
        # 设置宽松但有上限的超时，让挂起的测试最终失败，而不是一直阻塞作业。
        # 命令形式与 ci.yml 的竞态门禁保持一致。
        run: go test -race -timeout 20m $(go list ./... | grep -v '/internal/pty$')

  # AGENTS.md 的依赖规则被编码成一个测试：核心只用标准库、不使用被禁止的导入、
  # 不引入新模块。-count=1 会绕过 Go 的测试缓存，从而确保每个 pull request 都真正
  # 评估这一不变量。
  archguard:
    name: archguard (dependency guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: architecture guard
        run: go test ./internal/archguard -count=1

  # 手动诊断作业：仅在 workflow_dispatch 且显式勾选 flake_guard 时运行。
  # 不按 PR 触发，也不作为必需检查，因此不会阻塞任何 PR；
  # continue-on-error 保证即使检测到抖动也不会让手动运行整体失败。
  flake-guard:
    name: flake-guard (manual, non-blocking)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.flake_guard }}
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: flake-guard (3x repetition)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/flake-guard.ps1 -Count 3
