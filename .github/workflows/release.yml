name: release

# 由 tag 触发、仅面向 Windows 的发布流水线。
#
# 可复现性：tag 必须等于编译进二进制文件的 Version（由 check-release-consistency.ps1
# 和 build-release.ps1 强制校验），构建使用 -trimpath 与 CGO_ENABLED=0，
# 并且在任何内容发布之前，scripts/verify-release.ps1 会断言制品完全一致。
# 桌面客户端（native/）由此 tag 的源码构建，并继续使用标准的
# latest-release 更新器；这里不固定任何版本。
#
# 完整验证门禁：`verify` 对应 ci.yml 的 `go` 作业，
# `race` 对应 ci.yml 的 race 作业（ubuntu，排除 internal/pty）。
# `release` 会等待两者完成。

on:
  push:
    tags: ['v*']

# 最小权限：每个作业都只能读取仓库；只有 `release` 可以写入 Release。
# 令牌是自动提供的 GITHUB_TOKEN 密钥。它不会被打印、写入文件，也不会在本工作流的
# 任何位置被硬编码。
permissions:
  contents: read

jobs:
  # 与 ci.yml 的 `go` 作业使用相同的门禁：tag 不得发布会让 CI 失败的代码。
  # 运行在 windows-latest 上，因为它是实际发布的目标。
  verify:
    name: verify (windows-latest)
    runs-on: windows-latest
    steps:
      # Windows runner 默认以 CRLF 检出；gofmt 必须看到实际提交的字节，
      # 因此要在 checkout 之前禁用 autocrlf。
      - name: Normalize line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # 版本来自 go.mod（1.27.3），与 ci.yml 使用的输入相同。
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (must print nothing)
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      # 原生命令返回非零值不一定会停止 pwsh，因此每个门禁都要显式检查
      # $LASTEXITCODE。
      - name: go vet
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "go vet failed ($LASTEXITCODE)" }

      - name: go test
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "go test failed ($LASTEXITCODE)" }

      - name: build (no cgo, windows/amd64)
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          go build ./cmd/argent
          if ($LASTEXITCODE -ne 0) { throw "windows build failed ($LASTEXITCODE)" }

      - name: cross-compile (linux/amd64, no cgo)
        shell: pwsh
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw "cross-compile failed ($LASTEXITCODE)" }

  # 与 ci.yml 的 race 作业一致：竞态检测器需要 cgo + gcc，因此运行在 ubuntu 上。
  # internal/pty 的测试需要真正的控制终端，这里将其排除（Windows 上的 `verify` 作业
  # 覆盖该包）。
  race:
    name: go test -race (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        env:
          CGO_ENABLED: '1'
        run: go test -race $(go list ./... | grep -v '/internal/pty$')

  # 仅在完整验证门禁全部通过后才发布。
  release:
    name: release (windows-latest)
    needs: [verify, race]
    runs-on: windows-latest
    permissions:
      contents: write # 创建 Release 并上传其资源所必需的
    steps:
      - name: Normalize line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 通过环境变量传递 tag，而不是将其插值到脚本文本中，这样特殊的 tag
      # 就不会被当作 shell 代码解析。
      - name: Check release metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pwsh -NoProfile -File scripts/check-release-consistency.ps1 -Tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "release metadata check failed ($LASTEXITCODE)" }

      # 将 argent.exe + argent-native.exe 构建到 dist/release，并写入 checksums.txt。
      # `verify` 和 `race` 已经运行了所有质量门禁，因此这里跳过脚本中重复的
      # vet/test/gofmt 检查。
      - name: Build release artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pwsh -NoProfile -File scripts/build-release.ps1 -Tag $env:RELEASE_TAG -SkipChecks
          if ($LASTEXITCODE -ne 0) { throw "build-release.ps1 failed ($LASTEXITCODE)" }

      # 上传前的独立断言：zip 存在、包含两个二进制文件，
      # 且其 SHA-256 与 checksums.txt 一致。任何不一致都会使该步骤失败，
      # 且不会发布任何内容。
      - name: Verify release artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          pwsh -NoProfile -File scripts/verify-release.ps1 -ArtifactDir dist/release -Version $version
          if ($LASTEXITCODE -ne 0) { throw "verify-release.ps1 failed ($LASTEXITCODE)" }

      - name: Extract release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pwsh -NoProfile -File scripts/extract-release-notes.ps1 -Tag $env:RELEASE_TAG -OutFile release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "extract-release-notes.ps1 failed ($LASTEXITCODE)" }

      # 之所以选用它而不是 softprops/action-gh-release：`gh` 随 GitHub 托管的 runner
      # 一同提供，因此无需信任任何第三方动作来持有写入令牌；而 --verify-tag 保证
      # Release 指向的正是当前检出的这个 tag。
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $zip = "dist/release/argent_${version}_windows_amd64.zip"
          gh release create $env:RELEASE_TAG $zip dist/release/checksums.txt `
            --title $env:RELEASE_TAG --notes-file release-notes.md --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }

      # 发布后的断言，确认两个预期的资源确实已上传。
      - name: Verify published Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $assets = @(gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "gh release view failed ($LASTEXITCODE)" }
          if ($assets -notcontains 'checksums.txt') { throw 'checksums.txt missing from Release' }
          $zip = "argent_${version}_windows_amd64.zip"
          if ($assets -notcontains $zip) { throw "$zip missing from Release" }
          Write-Host "Release $($env:RELEASE_TAG) published with $zip and checksums.txt"
