name: release

# Tag a commit that matches internal/cli/cli.go's Version constant (e.g. v0.1.2)
# to build and publish a Windows-only release. The scripts validate the tag
# against the source version, so a mismatched tag fails before anything is uploaded.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Keep LF endings on every runner; ci.yml sets the same policy so gofmt
      # sees the bytes that are actually committed.
      - name: Normalize line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check release metadata
        run: pwsh -NoProfile -File scripts/check-release-consistency.ps1 -Tag "${{ github.ref_name }}"

      - name: Build release artifacts
        run: pwsh -NoProfile -File scripts/build-release.ps1 -Tag "${{ github.ref_name }}"

      - name: Verify artifacts
        working-directory: dist/release
        run: |
          $zips = @(Get-ChildItem -Filter '*.zip')
          if ($zips.Count -ne 1) { throw "expected one zip, found $($zips.Count)" }
          $sums = Get-Content checksums.txt
          foreach ($line in $sums) {
            if (-not $line.Trim()) { continue }
            $parts = $line -split '\s+', 2
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $parts[1]).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0].ToLowerInvariant()) { throw "checksum mismatch: $($parts[1])" }
          }

      - name: Extract release notes
        run: pwsh -NoProfile -File scripts/extract-release-notes.ps1 -Tag "${{ github.ref_name }}" -OutFile release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/release/*.zip dist/release/checksums.txt `
            --title "${{ github.ref_name }}" --notes-file release-notes.md --verify-tag

      - name: Verify published Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --json url,assets > release.json
          Get-Content release.json
          $assets = (gh release view $tag --json assets --jq '.assets[].name')
          if (-not ($assets -contains 'checksums.txt')) { throw 'checksums.txt missing from Release' }
          $zip = "argent_$($tag.Substring(1))_windows_amd64.zip"
          if (-not ($assets -contains $zip)) { throw "$zip missing from Release" }
